name: test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calcomclone/src/frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calcomclone/src/frontend/package-lock.json

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run build-only

      - run: npm run test:e2e
        env:
          CI: 'true'
